[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Python path configuration
# This ensures the project root directory is in the Python path
pythonpath = .

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may require external dependencies)
    slow: Slow-running tests (skip with -m 'not slow')
    requires_llm: Tests that require actual LLM API calls (may cost money)
    requires_data: Tests that require dataset files
    e2e: End-to-end tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    -W ignore

# Asyncio mode
asyncio_mode = auto

# Log options
log_cli = false
log_cli_level = INFO

# Coverage options (if using pytest-cov)
# addopts = --cov=dslighting --cov=dsat --cov-report=html --cov-report=term
